    <style>
        .lightbox-overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.92); align-items: center; justify-content: center; cursor: pointer; }
        .lightbox-overlay.is-open { display: flex; }
        .lightbox-overlay img { max-width: 90vw; max-height: 90vh; object-fit: contain; pointer-events: none; }
    </style>
    <script>
        (function() {
            var triggers = document.querySelectorAll('.slide-image figure');
            var overlay = document.getElementById('portfolio-lightbox');
            var img = overlay.querySelector('img');
            if (!triggers.length || !overlay) return;
            function open(e, src, alt) { e.preventDefault(); e.stopPropagation(); img.src = src; img.alt = alt || 'Vergrößerte Ansicht'; overlay.classList.add('is-open'); overlay.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
            function close() { overlay.classList.remove('is-open'); overlay.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; img.src = ''; }
            triggers.forEach(function(figure) {
                var imgEl = figure.querySelector('img');
                if (!imgEl) return;
                figure.addEventListener('click', function(e) { open(e, imgEl.src, imgEl.alt); });
            });
            overlay.addEventListener('click', close);
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && overlay.classList.contains('is-open')) close(); });
        })();
    </script>
